<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Rishi AI — Local Assistant</title>
  <style>
    :root { --bg:#0b0f14; --panel:#111820; --muted:#8b98a8; --text:#e8eef6; --line:#202a35; --accent:#8b5cf6; --accent2:#6d28d9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top,#182230 0,#0b0f14 42%); color:var(--text); font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { width:min(1050px,100%); margin:0 auto; padding:18px; display:flex; flex-direction:column; min-height:100vh; }
    header { display:flex; align-items:center; justify-content:space-between; padding:12px 4px 18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(135deg,var(--accent),#22d3ee); font-weight:800; }
    h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:12px; }
    .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#64748b; } .dot.ok { background:#22c55e; }
    #chat { flex:1; display:flex; flex-direction:column; gap:12px; padding:10px 0 110px; }
    .msg { max-width:82%; padding:13px 15px; border:1px solid var(--line); border-radius:18px; white-space:pre-wrap; }
    .assistant { align-self:flex-start; background:rgba(17,24,32,.86); } .user { align-self:flex-end; background:linear-gradient(135deg,var(--accent2),var(--accent)); border-color:transparent; }
    .label { color:var(--muted); font-size:11px; margin-bottom:4px; }
    .composer { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:min(1014px,calc(100% - 36px)); background:rgba(17,24,32,.92); border:1px solid var(--line); border-radius:20px; padding:9px; display:flex; gap:8px; backdrop-filter:blur(12px); }
    textarea { flex:1; resize:none; border:0; outline:0; color:var(--text); background:transparent; min-height:44px; max-height:140px; padding:10px 12px; font:inherit; }
    button { border:0; border-radius:13px; padding:0 18px; color:white; background:var(--accent2); font-weight:700; cursor:pointer; } button:disabled { opacity:.5; cursor:not-allowed; }
    .welcome { text-align:center; margin:auto; padding:60px 20px; } .welcome h2 { font-size:34px; margin:0 0 8px; } .welcome p { color:var(--muted); margin:0; }
    code { color:#c4b5fd; }
    @media (max-width:640px){ .shell{padding:12px} .msg{max-width:92%} .composer{width:calc(100% - 24px); bottom:10px}.welcome h2{font-size:28px} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="logo">R</div><div><h1>Rishi AI</h1><div class="sub">Private • Local • Self-hosted</div></div></div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">Checking server…</span></div>
    </header>
    <main id="chat">
      <section class="welcome" id="welcome"><h2>Welcome Rishi!</h2><p>Your local AI assistant is running on your own server.</p></section>
    </main>
    <form class="composer" id="form"><textarea id="input" placeholder="Ask Rishi AI…" rows="1"></textarea><button id="send" type="submit">Send</button></form>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const dot = document.getElementById('dot');
    const history = [];
    function add(role, content) {
      welcome?.remove();
      const box = document.createElement('div'); box.className = `msg ${role}`;
      const label = document.createElement('div'); label.className='label'; label.textContent = role === 'user' ? 'You' : 'Rishi AI';
      const body = document.createElement('div'); body.textContent = content;
      box.append(label, body); chat.appendChild(box); box.scrollIntoView({behavior:'smooth', block:'end'});
    }
    async function health() {
      try { const r=await fetch('/api/health'); const d=await r.json(); const ok=d.ollama==='ok'; dot.classList.toggle('ok',ok); statusEl.textContent=ok?`Online • ${d.model}`:'Model server unavailable'; }
      catch { statusEl.textContent='Server unavailable'; }
    }
    health(); setInterval(health,15000);
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault(); const text=input.value.trim(); if(!text||send.disabled)return;
      input.value=''; input.style.height='auto'; add('user',text); history.push({role:'user',content:text}); send.disabled=true; send.textContent='…';
      const thinking='Thinking…'; add('assistant',thinking); const node=chat.lastElementChild;
      try { const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})}); const d=await r.json(); if(!r.ok) throw new Error(d.detail||'Request failed'); node.querySelector('div:last-child').textContent=d.content; history.push({role:'assistant',content:d.content}); }
      catch(err){ node.querySelector('div:last-child').textContent=`Error: ${err.message}`; }
      finally { send.disabled=false; send.textContent='Send'; input.focus(); health(); }
    });
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});
  </script>
</body>
</html>
